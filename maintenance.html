<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>D' Econo-Space — Back Soon</title>
  <style>
    :root {
      --ink: #2D302F;
      --gold: #BF9B30;
      --warm: #F5F3F0;
      --muted: #6B7068;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: var(--ink);
      color: var(--warm);
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    main { max-width: 520px; }
    .brand {
      font-size: 13px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 28px;
    }
    h1 { font-weight: 500; font-size: clamp(24px, 5vw, 34px); line-height: 1.25; }
    h1 em { display: block; color: var(--gold); font-size: 1.35em; margin-top: 6px; }
    p {
      margin-top: 22px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #D7D0C7;
    }
    a.btn {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 28px;
      border-radius: 10px;
      background: var(--gold);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 600;
      text-decoration: none;
    }
    a.btn:hover { background: #D4B54A; }
    small {
      display: block;
      margin-top: 34px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #9A9C97;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">D' Econo-Space · Lapu-Lapu, Cebu</div>
    <h1>We're preparing something better.<em>Back very soon.</em></h1>
    <p>Our booking site is being upgraded. To check availability or reserve a room, message us on Facebook and we'll take care of you.</p>
    <a class="btn" href="https://m.me/890165717502663">Message us on Messenger</a>
    <small>0917.678.4871 · 0926.149.9002</small>
  </main>
</body>
</html>
